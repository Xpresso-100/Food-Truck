<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Xpresso Food Truck</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <main class="login">
    <h1>Xpresso Food Truck</h1>
    <p class="muted">Sign in to order stock from HQ.</p>
    <form id="login-form" class="card" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div id="login-error" class="notice error" role="alert" aria-live="assertive"></div>
      <button id="login-submit" type="submit" class="block">Sign in</button>
    </form>
  </main>
</body>
</html>
